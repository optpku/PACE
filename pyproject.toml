[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-proof-agent"
version = "0.1.0"
description = "PACE: a natural-language mathematical proof and research agent with persistent findings and auditable execution records."
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
math = ["sympy>=1.12", "mpmath>=1.3"]

[project.scripts]
pace = "pace.cli:main"

[tool.setuptools]
package-dir = {pace = "src"}
packages = [
    "pace",
    "pace.agents",
    "pace.agents.research",
    "pace.agents.research.smi",
    "pace.agents.verification",
    "pace.contracts",
    "pace.contracts.problem",
    "pace.contracts.proof",
    "pace.contracts.research",
    "pace.contracts.verification",
    "pace.orchestrator",
    "pace.reporting",
    "pace.resources",
    "pace.resources.prompts",
    "pace.runtime",
    "pace.runtime.output",
]

[tool.setuptools.exclude-package-data]
"*" = ["resources/skills/reasatlas-query/*", "resources/skills/reasatlas-query/**/*"]

[tool.setuptools.package-data]
pace = [
    "resources/templates/neurips2026/*.sty",
    "resources/templates/neurips2026/*.md",
    "resources/variants/*/prompts/roles/*.md",
    "resources/skills/**/*.md",
    "resources/prompts/*.md",
    "resources/prompts/*/*.md",
    "resources/prompts/kernel/verification_cards/*.md",
]
